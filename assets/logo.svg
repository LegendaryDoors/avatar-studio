<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 180" width="414" height="180" role="img" aria-label="Avatar Studio">
  <title>Avatar Studio</title>
  <defs>
    <radialGradient id="orb" cx="40%" cy="32%" r="72%">
      <stop offset="0" stop-color="#d8ff8a"/>
      <stop offset="0.32" stop-color="#86d826"/>
      <stop offset="0.72" stop-color="#3e9e10"/>
      <stop offset="1" stop-color="#1b5c06"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d4d8dd"/>
      <stop offset="0.55" stop-color="#a7adb5"/>
      <stop offset="1" stop-color="#6f7680"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#c8ff7a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c8ff7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#e3e6ea"/>
      <stop offset="0.52" stop-color="#bfc4cb"/>
      <stop offset="1" stop-color="#8c939c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6e84a"/>
      <stop offset="1" stop-color="#3f9f12"/>
    </linearGradient>
    <clipPath id="inOrb"><circle cx="90" cy="90" r="64"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b2a03" flood-opacity="0.45"/>
    </filter>
    <filter id="textShadow" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- the orb: chrome rim, green glass -->
  <g filter="url(#soft)">
    <circle cx="90" cy="90" r="74" fill="url(#rim)"/>
    <circle cx="90" cy="90" r="66" fill="#1b5c06"/>
    <circle cx="90" cy="90" r="64" fill="url(#orb)"/>
  </g>

  <!-- an avatar, head and shoulders, in the glass -->
  <g clip-path="url(#inOrb)">
    <ellipse cx="90" cy="156" rx="70" ry="34" fill="url(#glow)"/>
    <path d="M40 160 C42 122 62 108 90 108 C118 108 138 122 140 160 Z" fill="#ffffff" fill-opacity="0.94"/>
    <ellipse cx="90" cy="76" rx="27" ry="29" fill="#ffffff" fill-opacity="0.94"/>
    <path d="M62 70 C62 46 118 46 118 70 C110 58 70 58 62 70 Z" fill="#e9f7d6" fill-opacity="0.9"/>
  </g>

  <!-- the glass's highlight -->
  <ellipse cx="82" cy="50" rx="44" ry="25" fill="url(#gloss)" clip-path="url(#inOrb)"/>

  <!-- the wordmark: a fixed length in any font, so the margins stay even -->
  <g filter="url(#textShadow)" font-family="'Segoe UI', 'Segoe UI Light', 'Helvetica Neue', Arial, sans-serif">
    <text x="186" y="94" font-size="62" font-weight="300" textLength="212" lengthAdjust="spacing" fill="url(#silver)" stroke="#6f7680" stroke-width="1.2" paint-order="stroke">AVATAR</text>
    <text x="190" y="146" font-size="40" font-weight="600" textLength="210" lengthAdjust="spacing" fill="url(#green)">STUDIO</text>
  </g>
</svg>
